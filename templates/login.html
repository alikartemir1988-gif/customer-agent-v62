<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل دخول الإدارة</title>
  <style>
    body{font-family:system-ui;background:#f5f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}.card{background:white;width:min(420px,88vw);padding:28px;border-radius:18px;box-shadow:0 12px 40px #0001}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;font-size:16px}input{border:1px solid #ccd3df;margin:10px 0 14px}button{border:0;background:#172033;color:white;font-weight:700;cursor:pointer}.error{background:#fff1f1;color:#9c1c1c;padding:10px;border-radius:8px}</style>
</head>
<body>
  <main class="card">
    <h1>لوحة إدارة الشركة</h1>
    <p>أدخل مفتاح الإدارة للوصول إلى الطلبات والإحصائيات.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label for="password">مفتاح الإدارة</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">دخول</button>
    </form>
  </main>
</body>
</html>
