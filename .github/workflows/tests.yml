name: Tests

on:
  push:
    branches:
      - main
      - agent/productization-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py dashboard.py

      - name: Validate production entry points
        run: |
          python -m gunicorn --check-config app:app
          python -m gunicorn --check-config dashboard:dashboard_app

      - name: Run tests
        run: python -m unittest discover -s tests -v
