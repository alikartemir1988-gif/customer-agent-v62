name: Tests

on:
  push:
    branches:
      - main
      - agent/productization-v1
      - botpress-evaluation
      - langfuse-observability
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py dashboard.py

      - name: Validate production entry points
        run: |
          python -m gunicorn --check-config app:app
          python -m gunicorn --check-config dashboard:dashboard_app

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify Langfuse credentials and submit a synthetic trace
        if: github.event_name == 'push'
        env:
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
          LANGFUSE_TRACING_ENVIRONMENT: ci
          LANGFUSE_CAPTURE_CONTENT: "false"
        run: python scripts/langfuse_smoke.py

  botpress-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: botpress/package-lock.json

      - name: Install Botpress dependencies
        working-directory: botpress
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check Botpress adapter and evals
        working-directory: botpress
        run: npm run typecheck

      - name: Audit Botpress production dependencies
        working-directory: botpress
        run: npm audit --omit=dev --audit-level=high
