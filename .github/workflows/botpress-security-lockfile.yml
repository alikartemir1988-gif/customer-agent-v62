name: Regenerate Botpress security lockfile
on:
  push:
    branches:
      - security/botpress-undici-zod-2026
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: botpress/package-lock.json
      - name: Regenerate lockfile
        working-directory: botpress
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add botpress/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Botpress lockfile with patched dependencies"
            git push origin HEAD:security/botpress-undici-zod-2026
          fi
      - name: Install from lockfile
        working-directory: botpress
        run: npm ci
      - name: TypeScript typecheck
        working-directory: botpress
        run: npm run typecheck
      - name: Security audit
        working-directory: botpress
        run: npm audit --omit=dev --audit-level=high
