name: Majd sales tests

on:
  push:
    branches:
      - majd-sales-bot
      - 'fix/majd-*'
  pull_request:
    branches:
      - majd-sales-bot

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAJD_TELEGRAM_BOT_TOKEN: ''
      MAJD_WEBHOOK_URL: ''
      DATABASE_URL: ''
      MAJD_RUN_GEMINI_SMOKE_TESTS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile sales service
        run: python -m py_compile majd_sales_bot.py scripts/verify_majd_release.py
      - name: Validate production entry point
        run: python -m gunicorn --check-config majd_sales_bot:app
      - name: Run sales regressions
        run: python -m unittest discover -s tests -p 'test_majd*.py' -v
